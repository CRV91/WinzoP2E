<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WINZO P2E</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #050608; color: white; font-family: sans-serif; margin: 0; padding: 0; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .board-grid { display: grid; background: rgba(255,255,255,0.05); gap: 1px; border: 1px solid rgba(255,255,255,0.1); }
    .cell { background: #050608; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const [view, setView] = useState('lobby'); // lobby, game
      const [gameType, setGameType] = useState(null);
      const [stars, setStars] = useState(2500);

      useEffect(() => {
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      }, []);

      // Cấu hình bàn cờ cho từng loại
      const config = {
        caro: { name: 'Cờ Caro', cols: 15, size: 225, color: '#3b82f6' },
        chess: { name: 'Cờ Vua', cols: 8, size: 64, color: '#6366f1' },
        xiangqi: { name: 'Cờ Tướng', cols: 9, size: 90, color: '#ef4444' },
        go: { name: 'Cờ Vây', cols: 13, size: 169, color: '#10b981' }
      };

      const renderBoard = () => {
        const c = config[gameType];
        const cells = Array(c.size).fill(null);
        return (
          <div className="p-4 animate-in fade-in">
            <div className="flex justify-between items-center mb-6">
              <button onClick={() => setView('lobby')} className="text-white/40 font-bold">← THOÁT</button>
              <h2 style={{color: c.color}} className="font-black italic uppercase">{c.name}</h2>
              <div className="w-10"></div>
            </div>
            
            <div className="board-grid" style={{ gridTemplateColumns: `repeat(${c.cols}, 1fr)` }}>
              {cells.map((_, i) => (
                <div key={i} className="cell active:bg-white/10" onClick={() => window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light')}>
                  {/* Demo quân cờ */}
                  {gameType === 'caro' && i === 112 && <span className="text-blue-500 font-black">X</span>}
                  {gameType === 'chess' && i < 8 && <div className="w-3 h-3 rounded-full bg-white/20"></div>}
                </div>
              ))}
            </div>

            <div className="mt-8 glass p-6 rounded-3xl text-center">
              <p className="text-[10px] text-white/30 font-bold tracking-widest mb-1">TRẠNG THÁI</p>
              <p className="text-xs font-bold text-blue-400">Đang tìm đối thủ xứng tầm...</p>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen pb-24">
          {view === 'lobby' ? (
            <div className="p-6 space-y-6">
              <div className="glass p-5 rounded-[2rem] flex justify-between items-center">
                <span className="font-black text-xl italic tracking-tighter">WINZO</span>
                <div className="bg-yellow-500/10 px-4 py-1 rounded-full border border-yellow-500/20 text-yellow-500 font-bold text-sm">
                  {stars} ⭐
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4 pt-4">
                {Object.keys(config).map((key) => (
                  <div key={key} onClick={() => { setGameType(key); setView('game'); }} className="glass p-6 rounded-[2.5rem] flex flex-col items-center gap-4 active:scale-95 transition-all">
                    <div className="w-12 h-12 rounded-2xl flex items-center justify-center bg-white/5" style={{color: config[key].color}}>
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                    </div>
                    <span className="font-bold text-sm">{config[key].name}</span>
                    <button className="w-full py-2 rounded-xl text-[10px] font-black uppercase text-white/50 border border-white/5">Vào bàn</button>
                  </div>
                ))}
              </div>
            </div>
          ) : renderBoard()}

          {/* Nav Bottom */}
          <div className="fixed bottom-8 left-8 right-8 flex justify-center">
            <nav className="glass h-16 w-full max-w-xs rounded-full flex items-center justify-around px-8 shadow-2xl">
              <button onClick={() => setView('lobby')} className={view === 'lobby' ? 'text-blue-500' : 'text-white/20'}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              </button>
              <div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-blue-500/50">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              </div>
              <button className="text-white/20">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </button>
            </nav>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
