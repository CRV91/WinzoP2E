<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WINZO P2E - Ultimate Gaming</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

    body { 
      background-color: #050608; 
      margin: 0; 
      color: white; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Hiệu ứng nền mờ ảo */
    .bg-glow {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% -20%, #1e3a8a 0%, transparent 50%),
                  radial-gradient(circle at 0% 100%, #1e1b4b 0%, transparent 40%);
      z-index: -1;
    }

    /* Glassmorphism */
    .glass { 
      background: rgba(255, 255, 255, 0.03); 
      backdrop-filter: blur(15px); 
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Animation cho các phần tử */
    .fade-up {
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-shadow {
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    /* Hiệu ứng nút bấm */
    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:active { transform: scale(0.96); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 0px; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icons = {
      Zap: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
      Star: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" className="text-yellow-400"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>,
      Trophy: () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>,
      Home: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>,
      User: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
      Swords: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"></polyline><line x1="13" y1="19" x2="19" y2="13"></line><line x1="16" y1="16" x2="20" y2="20"></line><line x1="19" y1="21" x2="20" y2="20"></line><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"></polyline><line x1="5" y1="14" x2="9" y2="18"></line><line x1="7" y1="17" x2="4" y2="20"></line><line x1="3" y1="21" x2="4" y2="20"></line></svg>
    };

    const App = () => {
      const [view, setView] = useState('lobby');
      const [userStars, setUserStars] = useState(2500);

      useEffect(() => {
        if (window.Telegram?.WebApp) {
          const tg = window.Telegram.WebApp;
          tg.ready();
          tg.expand();
          tg.headerColor = '#050608';
          tg.backgroundColor = '#050608';
        }
      }, []);

      return (
        <div className="min-h-screen pb-32">
          {/* Top Header */}
          <div className="px-6 pt-6 pb-2 fade-up" style={{animationDelay: '0.1s'}}>
            <div className="flex justify-between items-center glass p-3 px-5 rounded-[2rem] card-shadow">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/40 text-white">
                  <Icons.Zap />
                </div>
                <div>
                  <h1 className="text-lg font-extrabold tracking-tighter leading-none">WINZO</h1>
                  <p className="text-[10px] text-blue-400 font-bold tracking-widest uppercase">Premium</p>
                </div>
              </div>
              <div className="flex items-center gap-2 bg-white/5 py-2 px-4 rounded-2xl border border-white/5">
                <Icons.Star />
                <span className="font-extrabold text-sm">{userStars.toLocaleString()}</span>
              </div>
            </div>
          </div>

          {view === 'lobby' ? (
            <div className="px-6 mt-6 space-y-6">
              {/* Welcome Banner */}
              <div className="relative overflow-hidden rounded-[2.5rem] p-6 glass border-blue-500/20 fade-up" style={{animationDelay: '0.2s'}}>
                <div className="relative z-10">
                  <h2 className="text-2xl font-extrabold leading-tight">Sẵn sàng<br/>thách đấu?</h2>
                  <p className="text-white/50 text-xs mt-2 font-medium">Chọn trò chơi bạn yêu thích nhất</p>
                </div>
                <div className="absolute right-[-10px] bottom-[-10px] opacity-20 transform rotate-12">
                  <Icons.Trophy />
                </div>
              </div>

              {/* Game Grid */}
              <div className="grid grid-cols-2 gap-4 fade-up" style={{animationDelay: '0.3s'}}>
                {[
                  { name: 'Cờ Vua', color: 'from-blue-500', icon: 'Swords' },
                  { name: 'Cờ Tướng', color: 'from-red-500', icon: 'Trophy' },
                  { name: 'Cờ Vây', color: 'from-emerald-500', icon: 'Zap' },
                  { name: 'Cờ Caro', color: 'from-amber-500', icon: 'Star' }
                ].map((game, i) => (
                  <div key={game.name} className="group relative bg-white/5 border border-white/10 p-5 rounded-[2.2rem] flex flex-col items-center gap-4 active:scale-95 transition-all card-shadow">
                    <div className={`w-14 h-14 bg-gradient-to-br ${game.color} to-transparent opacity-20 absolute rounded-full blur-xl`}></div>
                    <div className="relative w-16 h-16 bg-white/5 rounded-3xl flex items-center justify-center text-white/80 group-hover:text-white transition-colors">
                      <Icons.Trophy />
                    </div>
                    <div className="text-center">
                      <span className="font-extrabold text-sm block">{game.name}</span>
                      <span className="text-[9px] text-white/40 font-bold uppercase tracking-wider">Online 1.2k</span>
                    </div>
                    <button className="w-full btn-primary py-2.5 rounded-2xl text-[10px] font-extrabold uppercase tracking-tighter">Tham gia</button>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="px-6 mt-10 space-y-8 fade-up text-center">
              <div className="relative inline-block">
                <div className="w-32 h-32 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-[3rem] flex items-center justify-center border-8 border-white/5 shadow-2xl mx-auto overflow-hidden">
                   <Icons.User />
                </div>
                <div className="absolute bottom-1 right-1 bg-green-500 w-6 h-6 rounded-full border-4 border-[#050608]"></div>
              </div>
              
              <div>
                <h2 className="text-3xl font-extrabold tracking-tight">Winzo Player</h2>
                <p className="text-blue-400 text-xs font-bold uppercase tracking-[0.2em] mt-2">Rank: Diamond I</p>
              </div>

              <div className="grid grid-cols-2 gap-4 w-full">
                <div className="glass p-6 rounded-[2.2rem] border-white/5">
                  <p className="text-[10px] text-white/40 font-bold uppercase tracking-widest mb-1">Tỉ lệ thắng</p>
                  <p className="text-2xl font-extrabold">68%</p>
                </div>
                <div className="glass p-6 rounded-[2.2rem] border-white/5">
                  <p className="text-[10px] text-white/40 font-bold uppercase tracking-widest mb-1">Thứ hạng</p>
                  <p className="text-2xl font-extrabold">#1,024</p>
                </div>
              </div>

              <button className="w-full glass py-5 rounded-[2rem] border-white/10 font-extrabold text-sm flex items-center justify-center gap-3 active:scale-95 transition-all">
                Cài đặt tài khoản
              </button>
            </div>
          )}

          {/* Tab Navigation */}
          <div className="fixed bottom-8 left-8 right-8 z-50 fade-up" style={{animationDelay: '0.5s'}}>
            <nav className="glass border-white/10 h-20 rounded-[2.5rem] flex items-center justify-around px-6 card-shadow shadow-blue-900/20">
              <button 
                onClick={() => setView('lobby')} 
                className={`flex flex-col items-center gap-1 transition-all duration-300 ${view === 'lobby' ? 'text-blue-500 scale-110' : 'text-white/30 hover:text-white/60'}`}
              >
                <Icons.Home />
                {view === 'lobby' && <div className="w-1 h-1 bg-blue-500 rounded-full"></div>}
              </button>
              
              <div className="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-600/50 active:scale-90 transition-transform">
                <Icons.Zap />
              </div>

              <button 
                onClick={() => setView('profile')} 
                className={`flex flex-col items-center gap-1 transition-all duration-300 ${view === 'profile' ? 'text-blue-500 scale-110' : 'text-white/30 hover:text-white/60'}`}
              >
                <Icons.User />
                {view === 'profile' && <div className="w-1 h-1 bg-blue-500 rounded-full"></div>}
              </button>
            </nav>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
