<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WINZO P2E</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700;900&display=swap');
        body { background: #02040a; color: #e2e8f0; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .font-game { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .neon-blue { border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 0 15px rgba(59, 130, 246, 0.1); }
        .btn-blue { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
        
        /* Board Styles */
        .board-grid { display: grid; gap: 1px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; margin: 0 auto; }
        .cell { background: #05060b; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 8px; }
        .cell:active { background: #1e293b; }
        
        .bg-mesh { position: fixed; inset: 0; z-index: -1; background-image: radial-gradient(at 50% -20%, rgba(30, 58, 138, 0.2) 0px, transparent 50%); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div id="app" class="h-screen flex flex-col"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const i18n = {
            vi: { lobby: "Sảnh", friends: "Bạn bè", stars: "Số dư", invite: "Mời bạn", copy: "Sao chép", start: "Chơi ngay", back: "Quay lại", comm: "Hoa hồng 2%", wait: "Đang tìm đối thủ..." },
            en: { lobby: "Lobby", friends: "Affiliate", stars: "Balance", invite: "Invite", copy: "Copy Link", start: "Play Now", back: "Back", comm: "2% Bonus", wait: "Matching..." }
        };

        let state = {
            lang: 'vi',
            view: 'lobby',
            stars: 2500,
            currentGame: null,
            games: {
                caro: { name: 'Caro', cols: 15, size: 225, color: '#3b82f6', icon: '🏆' },
                chess: { name: 'Chess', cols: 8, size: 64, color: '#818cf8', icon: '⚔️' },
                xiangqi: { name: 'Xiangqi', cols: 9, size: 90, color: '#ef4444', icon: '🏯' },
                go: { name: 'Go', cols: 13, size: 169, color: '#10b981', icon: '☯️' }
            }
        };

        function render() {
            const root = document.getElementById('app');
            const t = i18n[state.lang];
            let html = '';

            // Header
            html += `
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-black text-white italic">W</div>
                        <span class="font-game text-sm tracking-tighter">WINZO</span>
                    </div>
                    <div class="flex gap-1 glass p-1 rounded-lg">
                        <div onclick="setLang('vi')" class="px-2 py-1 text-[10px] font-bold cursor-pointer ${state.lang==='vi'?'bg-blue-600 rounded-md':''}">VN</div>
                        <div onclick="setLang('en')" class="px-2 py-1 text-[10px] font-bold cursor-pointer ${state.lang==='en'?'bg-blue-600 rounded-md':''}">EN</div>
                    </div>
                </div>
            `;

            if (state.view === 'lobby') {
                html += `
                    <div class="px-5 flex-1 overflow-y-auto fade-in">
                        <div class="glass neon-blue p-5 rounded-[2rem] mb-6 flex justify-between items-center">
                            <div>
                                <p class="text-[9px] uppercase font-bold text-blue-400 mb-1">${t.stars}</p>
                                <p class="text-2xl font-black font-game">${state.stars.toLocaleString()} <span class="text-xs text-yellow-500 italic">⭐</span></p>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-500 italic font-black">W</div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            ${Object.keys(state.games).map(key => `
                                <div onclick="goGame('${key}')" class="glass p-5 rounded-[2.5rem] flex flex-col items-center gap-3 active:scale-95 transition-all">
                                    <div class="text-3xl">${state.games[key].icon}</div>
                                    <span class="font-black text-xs uppercase tracking-tighter">${state.games[key].name}</span>
                                    <button class="w-full btn-blue py-2 rounded-xl text-[9px] font-black uppercase">${t.start}</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } 
            else if (state.view === 'friends') {
                html += `
                    <div class="px-5 flex-1 fade-in">
                        <div class="glass p-6 rounded-[2.5rem] mb-6 text-center">
                            <h3 class="font-game text-lg mb-1">${t.invite}</h3>
                            <p class="text-[9px] text-blue-400 font-bold uppercase mb-4">${t.comm}</p>
                            <button onclick="copyRef()" class="w-full btn-blue py-3 rounded-xl font-black text-xs uppercase">${t.copy}</button>
                        </div>
                        <div class="space-y-3 opacity-50 text-center py-10">
                            <p class="text-xs italic tracking-widest uppercase">No referrals yet</p>
                        </div>
                    </div>
                `;
            }
            else if (state.view === 'game') {
                const g = state.games[state.currentGame];
                html += `
                    <div class="px-4 flex-1 fade-in">
                        <div class="flex justify-between items-center mb-6">
                            <button onclick="setView('lobby')" class="text-xs font-bold text-white/40 uppercase tracking-widest">← ${t.back}</button>
                            <h2 style="color: ${g.color}" class="font-game text-sm uppercase">${g.name}</h2>
                            <div class="w-10"></div>
                        </div>
                        <div class="board-grid shadow-2xl shadow-black" style="grid-template-columns: repeat(${g.cols}, 1fr);">
                            ${Array(g.size).fill(0).map(() => `<div class="cell" onclick="tap()"></div>`).join('')}
                        </div>
                        <div class="mt-8 glass p-6 rounded-[2rem] text-center">
                            <p class="animate-pulse text-xs font-bold text-blue-400 italic">${t.wait}</p>
                        </div>
                    </div>
                `;
            }

            // Navbar
            html += `
                <div class="p-6">
                    <div class="glass h-16 rounded-[2.5rem] flex items-center justify-around px-6 neon-blue shadow-2xl">
                        <button onclick="setView('lobby')" class="${state.view==='lobby'?'text-blue-500 scale-125':'text-white/20'}">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                        </button>
                        <div onclick="setView('lobby')" class="w-12 h-12 btn-blue rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/50 rotate-45 transform active:scale-90 transition-all">
                            <div class="-rotate-45 font-game text-white text-xs">W</div>
                        </div>
                        <button onclick="setView('friends')" class="${state.view==='friends'?'text-blue-500 scale-125':'text-white/20'}">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>
                        </button>
                    </div>
                </div>
            `;

            root.innerHTML = html;
        }

        window.setLang = (l) => { state.lang = l; render(); };
        window.setView = (v) => { state.view = v; tg?.HapticFeedback?.impactOccurred('medium'); render(); };
        window.goGame = (key) => { state.currentGame = key; setView('game'); };
        window.tap = () => tg?.HapticFeedback?.impactOccurred('light');
        window.copyRef = () => {
            tg?.showPopup({ message: state.lang === 'vi' ? "Đã sao chép link mời nhận 2% hoa hồng!" : "Copy success! Get 2% commission now." });
            tg?.HapticFeedback?.notificationOccurred('success');
        };

        render();
    </script>
</body>
</html>
