<script type="text/babel">
    const { useState, useEffect } = React;

    // Hệ thống Icon SVG an toàn
    const Icons = {
      Zap: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
      Star: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" className="text-yellow-400"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>,
      Trophy: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17M14 14.66V17M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>,
      Home: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>,
      User: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
      Swords: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l1-1"></path></svg>
    };

    const App = () => {
      const [view, setView] = useState('lobby'); // lobby, profile, game
      const [currentGame, setCurrentGame] = useState(null); // caro, chess, xiangqi, go
      const [stars, setStars] = useState(2500);
      const [board, setBoard] = useState([]);

      // Khởi tạo bàn cờ tương ứng
      const initGame = (type) => {
        setCurrentGame(type);
        setView('game');
        if (type === 'caro') setBoard(Array(15 * 15).fill(null));
        if (type === 'chess') setBoard(Array(8 * 8).fill(null)); // Đơn giản hóa
        if (type === 'go') setBoard(Array(13 * 13).fill(null));
        if (type === 'xiangqi') setBoard(Array(9 * 10).fill(null));
      };

      const GameHeader = () => (
        <div className="flex justify-between items-center mb-6 px-2 animate-in fade-in">
          <button onClick={() => setView('lobby')} className="w-10 h-10 glass rounded-full flex items-center justify-center text-white/40">←</button>
          <div className="text-center">
            <h2 className="font-black text-blue-500 uppercase tracking-widest italic">
              {currentGame === 'caro' && "Cờ Caro"}
              {currentGame === 'chess' && "Cờ Vua"}
              {currentGame === 'go' && "Cờ Vây"}
              {currentGame === 'xiangqi' && "Cờ Tướng"}
            </h2>
            <p className="text-[8px] text-white/30 font-bold tracking-[0.3em]">MULTIPLAYER MODE</p>
          </div>
          <button onClick={() => initGame(currentGame)} className="w-10 h-10 glass rounded-full flex items-center justify-center text-blue-500">↻</button>
        </div>
      );

      return (
        <div className="min-h-screen pb-32">
          {/* Header Chính */}
          {view !== 'game' && (
            <div className="p-6 fade-up">
              <div className="glass p-4 rounded-[2rem] flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30"><Icons.Zap /></div>
                  <h1 className="font-extrabold text-lg tracking-tighter italic">WINZO</h1>
                </div>
                <div className="flex items-center gap-2 bg-white/5 py-2 px-4 rounded-2xl border border-white/5">
                  <Icons.Star /><span className="font-extrabold text-sm">{stars.toLocaleString()}</span>
                </div>
              </div>
            </div>
          )}

          {view === 'lobby' && (
            <div className="px-6 space-y-6 animate-in fade-in duration-500">
              <div className="grid grid-cols-2 gap-4">
                {[
                  { id: 'caro', name: 'Cờ Caro', icon: <Icons.Trophy />, color: 'blue' },
                  { id: 'chess', name: 'Cờ Vua', icon: <Icons.Swords />, color: 'indigo' },
                  { id: 'xiangqi', name: 'Cờ Tướng', icon: <Icons.Trophy />, color: 'red' },
                  { id: 'go', name: 'Cờ Vây', icon: <Icons.Zap />, color: 'emerald' }
                ].map((g) => (
                  <div key={g.id} onClick={() => initGame(g.id)} className="glass p-5 rounded-[2.2rem] flex flex-col items-center gap-4 active:scale-95 transition-all">
                    <div className={`w-16 h-16 bg-${g.color}-500/10 rounded-3xl flex items-center justify-center text-${g.color}-500`}>{g.icon}</div>
                    <span className="font-extrabold text-sm">{g.name}</span>
                    <button className={`w-full bg-${g.color}-600 py-2.5 rounded-2xl text-[10px] font-extrabold uppercase shadow-lg shadow-${g.color}-600/20`}>Vào bàn</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {view === 'game' && (
            <div className="px-4 pt-6">
              <GameHeader />
              <div className={`glass p-1 rounded-2xl grid bg-white/5 border-white/10 shadow-2xl overflow-hidden
                ${currentGame === 'caro' ? 'grid-cols-[repeat(15,minmax(0,1fr))]' : ''}
                ${currentGame === 'chess' ? 'grid-cols-[repeat(8,minmax(0,1fr))]' : ''}
                ${currentGame === 'go' ? 'grid-cols-[repeat(13,minmax(0,1fr))]' : ''}
                ${currentGame === 'xiangqi' ? 'grid-cols-[repeat(9,minmax(0,1fr))]' : ''}
              `}>
                {board.map((v, i) => (
                  <div key={i} className="aspect-square border-[0.1px] border-white/5 flex items-center justify-center text-[8px] active:bg-blue-500/20">
                    {/* Placeholder cho quân cờ */}
                    {currentGame === 'chess' && i < 16 && <div className="w-4 h-4 rounded-full bg-white/20"></div>}
                    {currentGame === 'xiangqi' && (i < 9 || i > 80) && <div className="w-5 h-5 rounded-full border border-red-500 text-red-500 flex items-center justify-center font-bold">楚</div>}
                  </div>
                ))}
              </div>
              <div className="mt-8 glass p-6 rounded-[2rem] text-center border-blue-500/20">
                <p className="text-white/40 text-[10px] font-bold uppercase tracking-widest">Trạng thái hệ thống</p>
                <p className="text-xs mt-1 font-bold">Đang kết nối Server để tìm đối thủ...</p>
              </div>
            </div>
          )}

          {view === 'profile' && (
             <div className="p-10 text-center animate-in fade-in">
                <div className="w-24 h-24 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-[2.5rem] mx-auto flex items-center justify-center mb-6 shadow-2xl shadow-blue-600/20"><Icons.User /></div>
                <h2 className="text-2xl font-black italic">WINZO PLAYER</h2>
                <div className="mt-6 flex gap-2 justify-center">
                    <span className="bg-white/5 px-4 py-2 rounded-xl border border-white/5 text-[10px] font-bold">LEVEL 1</span>
                    <span className="bg-white/5 px-4 py-2 rounded-xl border border-white/5 text-[10px] font-bold">0 WINS</span>
                </div>
             </div>
          )}

          {/* Tab Navigation */}
          <div className="fixed bottom-8 left-8 right-8 z-50">
            <nav className="glass h-20 rounded-[2.5rem] flex items-center justify-around px-6 shadow-2xl shadow-blue-900/20">
              <button onClick={() => setView('lobby')} className={view === 'lobby' ? 'text-blue-500 scale-110' : 'text-white/30'}><Icons.Home /></button>
              <div className="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-600/50 active:scale-90"><Icons.Zap /></div>
              <button onClick={() => setView('profile')} className={view === 'profile' ? 'text-blue-500 scale-110' : 'text-white/30'}><Icons.User /></button>
            </nav>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
