<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WINZO P2E</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { background-color: #050608; margin: 0; color: white; font-family: sans-serif; overflow-x: hidden; }
    #root { min-height: 100vh; }
    .glass { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; color:gray;">
      Đang khởi tạo WINZO...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      // Kiểm tra Lucide đã sẵn sàng chưa
      const icons = window.lucide || {};
      const { Trophy, Star, Swords, LayoutGrid, Award, Home, User, Globe, Zap } = icons;

      const [view, setView] = useState('lobby');
      const [userStars, setUserStars] = useState(2500);

      useEffect(() => {
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      }, []);

      // Nếu không có icon thì dùng chữ tạm để tránh lỗi crash
      const Icon = ({name, ...props}) => {
        const LucideIcon = icons[name];
        return LucideIcon ? <LucideIcon {...props} /> : <span style={{fontSize:'10px'}}>ICO</span>;
      };

      return (
        <div className="min-h-screen pb-24 p-4 animate-in fade-in duration-700">
          {/* Header */}
          <div className="flex justify-between items-center glass p-4 rounded-3xl border border-white/10 mb-6">
            <div className="flex items-center gap-2">
              <div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center shadow-lg">
                <Icon name="Zap" size={20} className="fill-white text-white" />
              </div>
              <span className="font-black text-xl tracking-tighter italic">WINZO</span>
            </div>
            <div className="flex items-center gap-2 bg-yellow-500/10 px-4 py-2 rounded-2xl border border-yellow-500/20">
              <Icon name="Star" size={16} className="text-yellow-500 fill-yellow-500" />
              <span className="font-bold text-yellow-500">{userStars.toLocaleString()}</span>
            </div>
          </div>

          {view === 'lobby' ? (
            <div className="space-y-4">
              <h2 className="text-sm font-black uppercase tracking-widest text-gray-500 px-2">Sảnh Game Hot</h2>
              <div className="grid grid-cols-2 gap-3">
                {['Cờ Vua', 'Cờ Tướng', 'Cờ Vây', 'Caro'].map((name) => (
                  <div key={name} className="bg-gray-900/50 p-6 rounded-[2rem] border border-white/5 flex flex-col items-center gap-3 active:scale-95 transition-transform">
                    <div className="w-12 h-12 bg-blue-500/10 rounded-2xl flex items-center justify-center text-blue-500">
                      <Icon name="Trophy" size={28} />
                    </div>
                    <span className="font-bold text-sm">{name}</span>
                    <button className="w-full bg-blue-600 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg shadow-blue-600/20">Chơi Ngay</button>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="flex flex-col items-center py-10 space-y-4">
              <div className="w-24 h-24 bg-indigo-600 rounded-[2rem] flex items-center justify-center border-4 border-gray-900 shadow-2xl">
                <Icon name="User" size={40} />
              </div>
              <h2 className="text-xl font-black">Người chơi Winzo</h2>
              <div className="bg-gray-900/80 p-6 rounded-3xl border border-white/5 w-full text-center">
                <p className="text-xs text-gray-500 font-bold uppercase mb-1">Thứ hạng</p>
                <p className="text-2xl font-black text-blue-500">#9,999</p>
              </div>
            </div>
          )}

          {/* Navigation */}
          <nav className="fixed bottom-6 left-6 right-6 glass border border-white/10 h-20 rounded-[2.5rem] flex items-center justify-around px-4 shadow-2xl">
            <button onClick={() => setView('lobby')} className={`p-4 rounded-2xl transition-all ${view === 'lobby' ? 'bg-blue-600 text-white' : 'text-gray-500'}`}>
              <Icon name="Home" size={24} />
            </button>
            <button onClick={() => setView('profile')} className={`p-4 rounded-2xl transition-all ${view === 'profile' ? 'bg-blue-600 text-white' : 'text-gray-500'}`}>
              <Icon name="User" size={24} />
            </button>
          </nav>
        </div>
      );
    };

    // Render an toàn
    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    } catch (err) {
      document.getElementById('root').innerHTML = `<div style="color:red; padding:20px;">Lỗi khởi động: ${err.message}</div>`;
    }
  </script>
</body>
</html>
