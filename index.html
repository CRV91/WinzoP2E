<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WINZO TEST</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center h-screen">
    <div id="root">Đang khởi tạo React...</div>

    <script type="text/babel">
        function App() {
            return (
                <div className="p-8 bg-blue-600 rounded-3xl shadow-2xl text-center animate-bounce">
                    <h1 className="text-2xl font-black">WINZO ĐÃ HOẠT ĐỘNG!</h1>
                    <p className="mt-2 opacity-80">Nếu bạn thấy thông báo này, hệ thống đã thông suốt.</p>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
