<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WINZO P2E</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050608; color: white; font-family: sans-serif; margin: 0; -webkit-user-select: none; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .board-container { 
            display: grid; 
            gap: 1px; 
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2);
            margin: 0 auto;
            max-width: 95vw;
        }
        .cell { background: #0b0e14; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; }
        .cell:active { background: #1e293b; }
        .nav-bar { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 70px; display: flex; justify-content: space-around; align-items: center; border-radius: 40px; z-index: 100; }
    </style>
</head>
<body>
    <div id="app-root">
        </div>

    <script>
        // Khởi tạo Telegram
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.headerColor = '#050608'; }

        let state = {
            view: 'lobby', // lobby hoặc game
            stars: 2500,
            currentGame: null,
            config: {
                caro: { name: 'Cờ Caro', cols: 15, size: 225, color: '#3b82f6' },
                chess: { name: 'Cờ Vua', cols: 8, size: 64, color: '#818cf8' },
                xiangqi: { name: 'Cờ Tướng', cols: 9, size: 90, color: '#ef4444' },
                go: { name: 'Cờ Vây', cols: 13, size: 169, color: '#10b981' }
            }
        };

        function render() {
            const root = document.getElementById('app-root');
            
            if (state.view === 'lobby') {
                root.innerHTML = `
                    <div class="p-6">
                        <div class="glass p-5 rounded-[2rem] flex justify-between items-center mb-8">
                            <span class="font-black text-2xl italic">WINZO</span>
                            <div class="text-yellow-500 font-bold">${state.stars} ⭐</div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            ${Object.keys(state.config).map(key => `
                                <div onclick="joinGame('${key}')" class="glass p-6 rounded-[2.5rem] flex flex-col items-center gap-4 active:scale-95 transition-all">
                                    <div class="w-12 h-12 rounded-2xl flex items-center justify-center bg-white/5" style="color: ${state.config[key].color}">
                                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                                    </div>
                                    <span class="font-bold text-sm">${state.config[key].name}</span>
                                    <div class="text-[9px] opacity-40 font-bold uppercase">Chạm để chơi</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                const c = state.config[state.currentGame];
                let boardHtml = '';
                for(let i=0; i<c.size; i++) {
                    boardHtml += `<div class="cell" onclick="handleCellClick(${i})"></div>`;
                }

                root.innerHTML = `
                    <div class="p-4 animate-in fade-in">
                        <div class="flex justify-between items-center mb-6">
                            <button onclick="goHome()" class="text-white/40 font-bold text-sm">← QUAY LẠI</button>
                            <h2 style="color: ${c.color}" class="font-black italic uppercase">${c.name}</h2>
                            <div class="w-10"></div>
                        </div>

                        <div class="board-container" style="grid-template-columns: repeat(${c.cols}, 1fr);">
                            ${boardHtml}
                        </div>

                        <div class="mt-8 glass p-6 rounded-[2rem] text-center border-blue-500/20">
                            <p class="text-[10px] text-white/30 font-bold tracking-widest mb-1">MÁY CHỦ</p>
                            <p class="text-xs font-bold text-blue-400">Đang đồng bộ hóa bàn cờ...</p>
                        </div>
                    </div>
                `;
            }

            // Render Nav Bar
            const nav = document.createElement('div');
            nav.className = 'nav-bar glass shadow-2xl';
            nav.innerHTML = `
                <button onclick="goHome()" style="color: ${state.view === 'lobby' ? '#3b82f6' : '#555'}">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                </button>
                <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center shadow-lg">
                    <svg width="20" height="20" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                </div>
                <button style="color: #555">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </button>
            `;
            root.appendChild(nav);
        }

        // Logic điều hướng
        window.joinGame = function(key) {
            state.view = 'game';
            state.currentGame = key;
            tg?.HapticFeedback?.impactOccurred('medium');
            render();
        };

        window.goHome = function() {
            state.view = 'lobby';
            state.currentGame = null;
            render();
        };

        window.handleCellClick = function(i) {
            tg?.HapticFeedback?.impactOccurred('light');
            // Logic đặt quân cờ sẽ thêm ở đây
        };

        // Khởi chạy lần đầu
        render();
    </script>
</body>
</html>
