<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WINZO P2E - COMPACT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700;900&display=swap');
        
        :root {
            --bg: #050608;
            --blue: #3b82f6;
        }

        body { 
            background: var(--bg); 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        .font-game { font-family: 'Orbitron', sans-serif; }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-blue { 
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); 
            transition: all 0.2s ease;
        }
        .btn-blue:active { transform: scale(0.95); }

        /* Bàn cờ tối ưu TO RÕ */
        .board-container {
            width: 100vw;
            height: 100vw;
            max-width: 500px;
            max-height: 500px;
            margin: 0 auto;
            position: relative;
        }

        .board-grid { 
            display: grid; gap: 1px; background: rgba(255,255,255,0.15); 
            width: 100%; height: 100%; border: 1px solid rgba(255,255,255,0.1);
        }

        .cell { 
            background: #0d1117; display: flex; 
            align-items: center; justify-content: center;
            transition: background 0.1s;
        }
        .cell:active { background: #1e293b; }
        .cell span { font-size: 1.2rem; font-weight: 900; }

        /* Modal Styles */
        .modal {
            position: fixed; inset: 0; z-index: 100;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8);
            padding: 20px;
        }
        .modal.active { display: flex; animation: fadeIn 0.2s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Compact layout tweaks */
        .compact-card { padding: 12px 16px; border-radius: 1.5rem; }
    </style>
</head>
<body>
    <div id="app" class="h-screen flex flex-col relative overflow-hidden"></div>

    <!-- Modal Nạp/Rút -->
    <div id="wallet-modal" class="modal">
        <div class="glass p-6 rounded-[2rem] w-full max-w-sm border-blue-500/30">
            <h2 id="modal-title" class="font-game text-center text-lg mb-4 italic">NẠP STARS</h2>
            <div class="space-y-3">
                <input type="number" id="wallet-amount" placeholder="Nhập số Stars..." class="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-white outline-none focus:border-blue-500">
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setAmount(100)" class="bg-white/5 py-2 rounded-lg text-xs">+100</button>
                    <button onclick="setAmount(500)" class="bg-white/5 py-2 rounded-lg text-xs">+500</button>
                    <button onclick="setAmount(1000)" class="bg-white/5 py-2 rounded-lg text-xs">+1k</button>
                </div>
                <button onclick="processWallet()" id="modal-btn" class="w-full btn-blue py-4 rounded-xl font-black text-xs uppercase mt-4">XÁC NHẬN</button>
                <button onclick="closeModal()" class="w-full text-white/40 py-2 text-[10px] font-bold">HỦY BỎ</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.headerColor = '#050608'; }

        let state = {
            lang: 'vi',
            view: 'lobby',
            stars: 2500,
            currentGame: null,
            board: [],
            walletAction: 'deposit', // deposit or withdraw
            games: {
                caro: { name: 'CARO', cols: 15, size: 225, icon: '🏆', color: '#3b82f6', piece: 'X', bot: 'O' },
                chess: { name: 'CHESS', cols: 8, size: 64, icon: '⚔️', color: '#818cf8', piece: '♟', bot: '♙' },
                xiangqi: { name: 'CỜ TƯỚNG', cols: 9, size: 90, icon: '🏯', color: '#ef4444', piece: '帥', bot: '卒' },
                go: { name: 'CỜ VÂY', cols: 13, size: 169, icon: '☯️', color: '#10b981', piece: '⚫', bot: '⚪' }
            }
        };

        function setView(v) { state.view = v; render(); }
        function setAmount(a) { document.getElementById('wallet-amount').value = a; }
        
        function openWallet(action) {
            state.walletAction = action;
            document.getElementById('modal-title').innerText = action === 'deposit' ? 'NẠP STARS' : 'RÚT STARS';
            document.getElementById('modal-btn').innerText = action === 'deposit' ? 'TIẾP TỤC NẠP' : 'YÊU CẦU RÚT';
            document.getElementById('wallet-modal').classList.add('active');
        }

        function closeModal() { document.getElementById('wallet-modal').classList.remove('active'); }

        function processWallet() {
            const val = parseInt(document.getElementById('wallet-amount').value);
            if (!val || val <= 0) return;

            if (state.walletAction === 'withdraw') {
                if (state.stars < val) { tg.showAlert("Không đủ Stars!"); return; }
                state.stars -= val;
                tg.showAlert(`Đã gửi yêu cầu rút ${val} Stars về ví Telegram!`);
            } else {
                state.stars += val;
                tg.showAlert(`Nạp thành công ${val} Stars!`);
            }
            closeModal();
            render();
        }

        function render() {
            const root = document.getElementById('app');
            let html = '';

            // Header Nhỏ gọn
            html += `
                <div class="p-4 flex justify-between items-center bg-black/20">
                    <div class="flex items-center gap-2" onclick="setView('lobby')">
                        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-black italic text-xs shadow-lg">W</div>
                        <span class="font-game text-xs tracking-tighter italic">WINZO</span>
                    </div>
                    <div class="flex items-center gap-2 glass px-3 py-1.5 rounded-full border-blue-500/20">
                        <span class="text-yellow-500 text-[10px]">⭐</span>
                        <span class="text-xs font-black tabular-nums">${state.stars.toLocaleString()}</span>
                    </div>
                </div>
            `;

            if (state.view === 'lobby') {
                html += `
                    <div class="px-4 flex-1 overflow-y-auto pt-2">
                        <!-- Card Wallet Nhỏ gọn -->
                        <div class="glass p-4 rounded-2xl mb-4 flex gap-2">
                            <button onclick="openWallet('deposit')" class="flex-1 btn-blue py-3 rounded-xl text-[10px] font-bold">NẠP STARS</button>
                            <button onclick="openWallet('withdraw')" class="flex-1 bg-white/5 border border-white/10 py-3 rounded-xl text-[10px] font-bold">RÚT TIỀN</button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 pb-24">
                            ${Object.keys(state.games).map(key => `
                                <div onclick="goGame('${key}')" class="glass p-4 rounded-3xl flex flex-col items-center gap-2 border-white/5 active:scale-95 transition-all">
                                    <div class="text-3xl">${state.games[key].icon}</div>
                                    <span class="font-black text-[9px] uppercase tracking-wider">${state.games[key].name}</span>
                                    <div class="w-full h-px bg-white/5 my-1"></div>
                                    <span class="text-[8px] text-blue-400 font-bold uppercase">CHƠI NGAY</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (state.view === 'game') {
                const g = state.games[state.currentGame];
                html += `
                    <div class="flex-1 flex flex-col">
                        <div class="p-4 flex justify-between items-center">
                            <button onclick="setView('lobby')" class="text-[10px] font-bold text-white/40">← QUAY LẠI</button>
                            <span class="font-game text-[10px]" style="color:${g.color}">${g.name}</span>
                            <button onclick="goGame('${state.currentGame}')" class="text-[10px] font-bold text-blue-400">LÀM MỚI</button>
                        </div>

                        <div class="board-container">
                            <div class="board-grid" style="grid-template-columns: repeat(${g.cols}, 1fr);">
                                ${state.board.map((cell, idx) => `
                                    <div class="cell" onclick="handleMove(${idx})">
                                        <span style="color: ${cell === g.piece ? g.color : '#fff'}">${cell || ''}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="mt-4 px-6 text-center">
                             <div class="glass p-4 rounded-2xl border-blue-500/10 flex justify-between items-center">
                                <div class="text-left">
                                    <p class="text-[8px] text-white/30 uppercase font-black">Người chơi</p>
                                    <p class="text-xs font-bold text-blue-400">Bạn (${g.piece})</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[8px] text-white/30 uppercase font-black">Đối thủ</p>
                                    <p class="text-xs font-bold text-white/60">Bot (${g.bot})</p>
                                </div>
                             </div>
                        </div>
                    </div>
                `;
            } else if (state.view === 'friends') {
                html += `
                    <div class="px-6 py-4 flex-1">
                        <div class="glass p-8 rounded-3xl text-center">
                            <div class="text-4xl mb-4">🎁</div>
                            <h3 class="font-game text-sm mb-2">MỜI BẠN BÈ</h3>
                            <p class="text-[10px] text-white/40 mb-6 uppercase tracking-widest leading-loose">Nhận 2% hoa hồng trọn đời<br>khi bạn bè chơi game</p>
                            <button onclick="tg.showAlert('Link đã copy!')" class="w-full btn-blue py-4 rounded-xl text-[10px] font-black uppercase">SAO CHÉP LINK MỜI</button>
                        </div>
                    </div>
                `;
            }

            // Navbar Bottom - Tối giản
            html += `
                <div class="fixed bottom-0 left-0 right-0 p-4 pb-8 bg-gradient-to-t from-black to-transparent">
                    <nav class="glass h-16 rounded-2xl flex items-center justify-around px-4 border-white/5">
                        <button onclick="setView('lobby')" class="flex flex-col items-center gap-1 ${state.view==='lobby'?'text-blue-500':'text-white/20'}">
                            <svg width="20" height="20" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                            <span class="text-[8px] font-black">SẢNH</span>
                        </button>
                        <button onclick="setView('friends')" class="flex flex-col items-center gap-1 ${state.view==='friends'?'text-blue-500':'text-white/20'}">
                            <svg width="20" height="20" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5s-3 1.34-3 3 1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                            <span class="text-[8px] font-black">BẠN BÈ</span>
                        </button>
                    </nav>
                </div>
            `;

            root.innerHTML = html;
        }

        window.goGame = (key) => {
            state.currentGame = key;
            state.board = Array(state.games[key].size).fill(null);
            setView('game');
        };

        window.handleMove = (idx) => {
            if (state.board[idx]) return;
            const g = state.games[state.currentGame];
            state.board[idx] = g.piece;
            tg?.HapticFeedback?.impactOccurred('light');
            render();

            setTimeout(() => {
                const empty = state.board.map((v, i) => v === null ? i : null).filter(v => v !== null);
                if (empty.length > 0) {
                    state.board[empty[Math.floor(Math.random()*empty.length)]] = g.bot;
                    render();
                }
            }, 500);
        };

        render();
    </script>
</body>
</html>
