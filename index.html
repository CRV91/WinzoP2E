<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WINZO P2E</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
            background: #050608; 
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        .font-game { font-family: 'Orbitron', sans-serif; }

        /* Cấu trúc Nền mờ ảo Mesh Gradient */
        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background-image: 
                radial-gradient(at 50% -20%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(17, 24, 39, 0.2) 0px, transparent 40%),
                radial-gradient(at 100% 100%, rgba(13, 24, 42, 0.15) 0px, transparent 40%);
        }

        /* Glassmorphism Card Premium */
        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Viền Neon Glow */
        .neon-blue { 
            border: 1px solid rgba(59, 130, 246, 0.3); 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15); 
        }
        
        /* Nút bấm Premium Gradient */
        .btn-blue { 
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); 
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
        }
        .btn-blue:active { transform: scale(0.96); filter: brightness(1.1); }

        /* Tab Active Effect */
        .tab-active { color: #3b82f6; transform: scale(1.15); }
        
        /* Board Styles (Giữ nguyên logic cũ) */
        .board-grid { display: grid; gap: 1px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; margin: 0 auto; max-width: 95vw;}
        .cell { background: #07090e; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 8px; }
        .cell:active { background: #1e293b; }
        
        /* Animation trượt nhẹ */
        .fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Ẩn scrollbar */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div id="app" class="h-screen flex flex-col relative overflow-hidden pb-32"></div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.headerColor = '#050608'; }

        const i18n = {
            vi: { lobby: "Sảnh Game", friends: "Bạn bè", stars: "SỐ DƯ STARS", invite: "MỜI BẠN BÈ", copy: "SAO CHÉP LINK", start: "CHƠI NGAY", back: "QUAY LẠI", comm: "NHẬN 2% HOA HỒNG", wait: "ĐANG GHÉP ĐỐI THỦ..." },
            en: { lobby: "Lobby", friends: "Affiliate", stars: "STARS BALANCE", invite: "INVITE FRIENDS", copy: "COPY LINK", start: "PLAY NOW", back: "BACK", comm: "GET 2% BONUS", wait: "MATCHING..." }
        };

        let state = {
            lang: 'vi',
            view: 'lobby',
            stars: 2500,
            currentGame: null,
            games: {
                caro: { name: 'Caro', cols: 15, size: 225, color: '#3b82f6', icon: '🏆' },
                chess: { name: 'Chess', cols: 8, size: 64, color: '#818cf8', icon: '⚔️' },
                xiangqi: { name: 'Xiangqi', cols: 9, size: 90, color: '#ef4444', icon: '🏯' },
                go: { name: 'Go', cols: 13, size: 169, color: '#10b981', icon: '☯️' }
            }
        };

        function render() {
            const root = document.getElementById('app');
            const t = i18n[state.lang];
            let html = '';

            // Header Tối ưu UI
            html += `
                <div class="p-6 flex justify-between items-center z-10">
                    <div class="flex items-center gap-3 active:scale-95 transition-transform" onclick="setView('lobby')">
                        <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center font-black text-white italic shadow-lg shadow-blue-500/30">W</div>
                        <span class="font-game text-lg tracking-tighter italic">WINZO</span>
                    </div>
                    <div class="flex gap-1 glass p-1.5 rounded-xl border border-white/5">
                        <div onclick="setLang('vi')" class="px-3 py-1 text-[10px] font-bold cursor-pointer transition-colors ${state.lang==='vi'?'bg-blue-600 rounded-lg text-white':'text-white/40'}">VN</div>
                        <div onclick="setLang('en')" class="px-3 py-1 text-[10px] font-bold cursor-pointer transition-colors ${state.lang==='en'?'bg-blue-600 rounded-lg text-white':'text-white/40'}">EN</div>
                    </div>
                </div>
            `;

            if (state.view === 'lobby') {
                html += `
                    <div class="px-6 flex-1 overflow-y-auto fade-in-up">
                        <div class="glass neon-blue p-6 rounded-[2.5rem] mb-6 flex justify-between items-center card-shadow">
                            <div>
                                <p class="text-[10px] uppercase font-bold text-blue-400 mb-1 tracking-widest">${t.stars}</p>
                                <p class="text-3xl font-black font-game">${state.stars.toLocaleString()} <span class="text-xs text-yellow-500 italic">⭐</span></p>
                            </div>
                            <div class="w-14 h-14 rounded-full border-4 border-blue-500/20 flex items-center justify-center bg-blue-500/10 shadow-inner">
                                <svg width="24" height="24" fill="currentColor" class="text-blue-500"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4 pt-2 pb-6">
                            ${Object.keys(state.games).map((key, i) => `
                                <div onclick="goGame('${key}')" style="animation-delay: ${i*0.05}s" class="glass p-5 rounded-[2.5rem] flex flex-col items-center gap-4 active:scale-95 transition-all group border-white/5 hover:border-blue-500/20">
                                    <div class="text-4xl mb-1 transform group-hover:scale-110 transition-transform">${state.games[key].icon}</div>
                                    <span class="font-black text-xs uppercase tracking-tight text-white/90">${state.games[key].name}</span>
                                    <button class="w-full btn-blue py-3 rounded-2xl text-[10px] font-black uppercase tracking-wider">${t.start}</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } 
            else if (state.view === 'friends') {
                html += `
                    <div class="px-6 flex-1 fade-in-up">
                        <div class="glass neon-blue p-8 rounded-[2.5rem] mb-6 text-center">
                            <h3 class="font-game text-xl mb-1">${t.invite}</h3>
                            <p class="text-[10px] text-blue-400 font-bold uppercase mb-5 tracking-widest">${t.comm}</p>
                            <button onclick="copyRef()" class="w-full btn-blue py-4 rounded-2xl font-black text-xs uppercase tracking-widest">${t.copy}</button>
                        </div>
                        <div class="space-y-3 opacity-30 text-center py-16">
                            <div class="text-6xl mb-4">👥</div>
                            <p class="text-xs italic tracking-widest uppercase font-medium">Chưa có bạn bè nào</p>
                        </div>
                    </div>
                `;
            }
            else if (state.view === 'game') {
                const g = state.games[state.currentGame];
                html += `
                    <div class="px-4 flex-1 fade-in-up">
                        <div class="flex justify-between items-center mb-6">
                            <button onclick="setView('lobby')" class="w-10 h-10 glass rounded-full flex items-center justify-center text-xs font-black border-white/5active:scale-90">←</button>
                            <div class="text-center">
                                <h2 style="color: ${g.color}" class="font-game text-sm uppercase tracking-wider">${g.name}</h2>
                                <p class="text-[8px] text-white/30 font-bold uppercase tracking-[0.3em]">MULTIPLAYER</p>
                            </div>
                            <div class="w-10 h-10 glass rounded-full flex items-center justify-center active:scale-90" onclick="goGame('${state.currentGame}')">↻</div>
                        </div>
                        <div class="board-grid shadow-2xl shadow-black" style="grid-template-columns: repeat(${g.cols}, 1fr);">
                            ${Array(g.size).fill(0).map(() => `<div class="cell" onclick="tap()"></div>`).join('')}
                        </div>
                        <div class="mt-8 glass p-6 rounded-[2.5rem] text-center border-blue-500/20 card-shadow">
                            <p class="animate-pulse text-xs font-bold text-blue-400 italic tracking-wide">${t.wait}</p>
                        </div>
                    </div>
                `;
            }

            // Navbar Bottom Tối ưu UI
            html += `
                <div class="fixed bottom-8 left-8 right-8 z-50">
                    <nav class="glass h-20 rounded-[2.5rem] flex items-center justify-around px-8 neon-blue shadow-3xl shadow-blue-900/30">
                        <button onclick="setView('lobby')" class="p-3 transition-all duration-300 ${state.view==='lobby'?'tab-active':'text-white/20 hover:text-white/50'}">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                        </button>
                        
                        <div onclick="setView('lobby')" class="w-14 h-14 btn-blue rounded-3xl flex items-center justify-center shadow-lg shadow-blue-600/50 rotate-45 transform active:scale-90 active:rotate-90 transition-all duration-500 cursor-pointer">
                            <div class="-rotate-45 font-game font-black text-white text-sm">W</div>
                        </div>
                        
                        <button onclick="setView('friends')" class="p-3 transition-all duration-300 ${state.view==='friends'?'tab-active':'text-white/20 hover:text-white/50'}">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>
                        </button>
                    </nav>
                </div>
            `;

            root.innerHTML = html;
        }

        window.setLang = (l) => { state.lang = l; render(); };
        window.setView = (v) => { state.view = v; tg?.HapticFeedback?.impactOccurred('medium'); render(); };
        window.goGame = (key) => { state.currentGame = key; setView('game'); };
        window.tap = () => tg?.HapticFeedback?.impactOccurred('light');
        window.copyRef = () => {
            tg?.showPopup({ message: state.lang === 'vi' ? "Đã sao chép link mời nhận 2% hoa hồng!" : "Copy success! Get 2% commission now." });
            tg?.HapticFeedback?.notificationOccurred('success');
        };

        render();
    </script>
</body>
</html>
