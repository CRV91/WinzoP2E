<script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ... (Giữ nguyên phần Icons và style cũ của bạn) ...

    const App = () => {
      const [view, setView] = useState('lobby'); // lobby, profile, caro
      const [userStars, setUserStars] = useState(2500);
      
      // Logic Bàn cờ Caro
      const [board, setBoard] = useState(Array(15 * 15).fill(null));
      const [isXNext, setIsXNext] = useState(true);
      const [winner, setWinner] = useState(null);

      useEffect(() => {
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      }, []);

      // Hàm kiểm tra thắng thua
      const checkWinner = (squares) => {
        const size = 15;
        const lines = [
          [1, 0], [0, 1], [1, 1], [1, -1] // Ngang, dọc, chéo xuôi, chéo ngược
        ];

        for (let i = 0; i < squares.length; i++) {
          if (!squares[i]) continue;
          const r = Math.floor(i / size);
          const c = i % size;

          for (const [dr, dc] of lines) {
            let count = 1;
            for (let step = 1; step < 5; step++) {
              const nr = r + dr * step;
              const nc = c + dc * step;
              if (nr >= 0 && nr < size && nc >= 0 && nc < size && squares[nr * size + nc] === squares[i]) {
                count++;
              } else break;
            }
            if (count >= 5) return squares[i];
          }
        }
        return null;
      };

      const handleSquareClick = (i) => {
        if (winner || board[i]) return;
        const newBoard = [...board];
        newBoard[i] = isXNext ? 'X' : 'O';
        setBoard(newBoard);
        setIsXNext(!isXNext);
        
        const win = checkWinner(newBoard);
        if (win) {
          setWinner(win);
          if (win === 'X') setUserStars(s => s + 500); // Thắng được cộng điểm
          window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred('success');
        } else {
          window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light');
        }
      };

      const resetGame = () => {
        setBoard(Array(15 * 15).fill(null));
        setWinner(null);
        setIsXNext(true);
      };

      // Màn hình chơi Caro
      const CaroGame = () => (
        <div className="px-4 py-2 fade-up">
          <div className="flex justify-between items-center mb-4">
            <button onClick={() => setView('lobby')} className="text-white/50 text-sm flex items-center gap-1">
              ← Thoát
            </button>
            <div className="text-center">
              <h3 className="font-bold text-lg">Cờ Caro</h3>
              <p className="text-[10px] text-blue-400 font-bold uppercase tracking-widest">
                {winner ? `Người thắng: ${winner}` : `Lượt đi: ${isXNext ? 'X' : 'O'}`}
              </p>
            </div>
            <button onClick={resetGame} className="text-blue-500 text-sm font-bold">Chơi lại</button>
          </div>

          <div className="glass p-2 rounded-2xl overflow-hidden aspect-square grid grid-cols-[repeat(15,minmax(0,1fr))] bg-white/5 border-white/10 shadow-2xl">
            {board.map((val, i) => (
              <div 
                key={i} 
                onClick={() => handleSquareClick(i)}
                className="border-[0.5px] border-white/5 aspect-square flex items-center justify-center text-[10px] font-black cursor-pointer active:bg-blue-500/20"
              >
                <span className={val === 'X' ? 'text-blue-500' : 'text-red-500'}>{val}</span>
              </div>
            ))}
          </div>

          {winner && (
            <div className="mt-6 glass p-6 rounded-3xl border-blue-500/30 text-center animate-bounce">
              <h2 className="text-2xl font-black text-blue-500">CHIẾN THẮNG!</h2>
              <p className="text-sm opacity-70">+500 Stars đã được cộng</p>
            </div>
          )}
        </div>
      );

      return (
        <div className="min-h-screen pb-32">
          {/* Header (Chỉ hiện ở Lobby và Profile) */}
          {view !== 'caro' && (
            <div className="px-6 pt-6 pb-2 fade-up">
               <div className="flex justify-between items-center glass p-3 px-5 rounded-[2rem] card-shadow">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg text-white">
                      <Icons.Zap />
                    </div>
                    <div>
                      <h1 className="text-lg font-extrabold tracking-tighter leading-none">WINZO</h1>
                      <p className="text-[10px] text-blue-400 font-bold tracking-widest uppercase">Premium</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2 bg-white/5 py-2 px-4 rounded-2xl border border-white/5">
                    <Icons.Star />
                    <span className="font-extrabold text-sm">{userStars.toLocaleString()}</span>
                  </div>
                </div>
            </div>
          )}

          {view === 'lobby' && (
            <div className="px-6 mt-6 space-y-6 fade-up">
              <div className="grid grid-cols-2 gap-4">
                {/* Nút chơi Caro - Chỉ nút này có link vào game */}
                <div onClick={() => setView('caro')} className="group relative bg-white/5 border border-white/10 p-5 rounded-[2.2rem] flex flex-col items-center gap-4 active:scale-95 transition-all card-shadow cursor-pointer">
                  <div className="relative w-16 h-16 bg-blue-500/10 rounded-3xl flex items-center justify-center text-blue-500"><Icons.Trophy /></div>
                  <div className="text-center">
                    <span className="font-extrabold text-sm block">Cờ Caro</span>
                    <span className="text-[9px] text-green-400 font-bold uppercase">Sẵn sàng</span>
                  </div>
                  <button className="w-full btn-primary py-2.5 rounded-2xl text-[10px] font-extrabold uppercase">Chơi ngay</button>
                </div>
                
                {/* Các game khác tạm để 'Sắp ra mắt' */}
                {['Cờ Vua', 'Cờ Tướng', 'Cờ Vây'].map(g => (
                  <div key={g} className="opacity-50 bg-white/5 border border-white/10 p-5 rounded-[2.2rem] flex flex-col items-center gap-4">
                     <div className="w-16 h-16 bg-white/5 rounded-3xl flex items-center justify-center text-white/20"><Icons.Swords /></div>
                     <span className="font-extrabold text-sm block text-white/40">{g}</span>
                     <span className="text-[8px] font-bold uppercase text-white/20 tracking-tighter italic text-center">Coming Soon</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {view === 'caro' && <CaroGame />}
          {view === 'profile' && <div className="p-10 text-center uppercase font-black opacity-20">Trang cá nhân</div>}

          {/* Tab Navigation */}
          <div className="fixed bottom-8 left-8 right-8 z-50">
            <nav className="glass border-white/10 h-20 rounded-[2.5rem] flex items-center justify-around px-6">
              <button onClick={() => setView('lobby')} className={`p-4 transition-all ${view === 'lobby' ? 'text-blue-500' : 'text-white/30'}`}><Icons.Home /></button>
              <div className="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center shadow-lg shadow-blue-600/50 active:scale-90"><Icons.Zap /></div>
              <button onClick={() => setView('profile')} className={`p-4 transition-all ${view === 'profile' ? 'text-blue-500' : 'text-white/30'}`}><Icons.User /></button>
            </nav>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
